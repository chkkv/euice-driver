name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CONFIGURATION: Release
  PLATFORM: ARM64

jobs:
  driver:
    name: Build ARM64 driver
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The hosted image ships Visual Studio 2022 and a Windows 10 SDK but no
      # WDK, so install the matching SDK + WDK (24H2 / 10.0.26100) first.
      # windows-2022 ships the WDK (10.1.26100.4202) and the WDK VS
      # extension, so no installation is required. Just show the layout so a
      # regression in the image is easy to spot.
      - name: Show WDK layout
        shell: pwsh
        run: |
          $roots = @(
            'C:\Program Files (x86)\Windows Kits\10\Include',
            'C:\Program Files (x86)\Windows Kits\10\Lib',
            'C:\Program Files (x86)\Windows Kits\10\bin'
          )
          foreach ($r in $roots) {
            Write-Host "== $r"
            if (Test-Path $r) { Get-ChildItem $r -Directory | ForEach-Object { Write-Host "   $($_.Name)" } }
          }
          $wdf = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10' -Recurse -Filter wdf.h -ErrorAction SilentlyContinue |
                 Select-Object -First 3
          if ($wdf) { $wdf | ForEach-Object { Write-Host "wdf.h: $($_.FullName)" } }
          else { Write-Host '::warning::wdf.h not found under Windows Kits' }

      - name: Dump KMDF status constants (diagnostic)
        shell: pwsh
        run: |
          $h = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Recurse -Filter wdfstatus.h -ErrorAction SilentlyContinue |
               Select-Object -First 1
          if ($h) {
            Write-Host "wdfstatus.h: $($h.FullName)"
            Select-String -Path $h.FullName -Pattern 'C02002' | ForEach-Object { Write-Host $_.Line.Trim() }
          } else {
            Write-Host 'wdfstatus.h not found'
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build driver (ARM64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild SiUsbXpArm64.vcxproj `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:SignMode=Off `
            /v:minimal /m
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "msbuild failed with exit code $code" }

      - name: Locate build output
        id: out
        shell: pwsh
        run: |
          $sys = Get-ChildItem -Recurse -Filter SiUsbXpArm64.sys | Select-Object -First 1
          if (-not $sys) { throw 'SiUsbXpArm64.sys not produced' }
          $dir = $sys.DirectoryName
          Write-Host "Output: $dir"
          "dir=$dir" >> $env:GITHUB_OUTPUT

      # TEST signing only. Production use requires an EV certificate and
      # Microsoft attestation signing; see README.md.
      - name: Create and export test certificate
        id: cert
        shell: pwsh
        run: |
          $dir = '${{ steps.out.outputs.dir }}'
          $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject 'CN=SiUsbXpArm64 Test' `
              -KeySpec Signature -KeyUsage DigitalSignature -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -CertStoreLocation Cert:\CurrentUser\My `
              -NotAfter (Get-Date).AddYears(3)
          Export-Certificate -Cert $cert -FilePath (Join-Path $dir 'SiUsbXpArm64Test.cer') | Out-Null
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"
          "thumb=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      # The binary must be signed BEFORE the catalog is generated, otherwise the
      # catalog hashes no longer match the signed file (this caused
      # "publisher trust ... was not established" on install).
      - name: Sign driver binary
        shell: pwsh
        run: |
          $dir = '${{ steps.out.outputs.dir }}'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
                      Where-Object { $_.FullName -match '\\x64\\' } |
                      Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool sign /v /fd SHA256 /s My /sha1 ${{ steps.cert.outputs.thumb }} "$dir\SiUsbXpArm64.sys"
          if ($LASTEXITCODE -ne 0) { throw 'sys signing failed' }

      - name: Generate catalog (inf2cat)
        shell: pwsh
        run: |
          $dir = '${{ steps.out.outputs.dir }}'
          Copy-Item 'inf\SiUsbXpArm64.inf' $dir -Force

          # Stamp a fresh DriverVer: otherwise every release carries the same
          # date/version and Windows keeps the previously installed package.
          $stampinf = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter stampinf.exe |
                      Where-Object { $_.FullName -match '\\x86\\' } |
                      Select-Object -First 1 -ExpandProperty FullName
          if (-not $stampinf) { throw 'stampinf.exe not found' }
          & $stampinf -f "$dir\SiUsbXpArm64.inf" -d '*' -v "3.3.0.${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { throw "stampinf failed with $LASTEXITCODE" }

          $inf2cat = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter inf2cat.exe |
                     Where-Object { $_.FullName -match '\\x86\\' } |
                     Select-Object -First 1 -ExpandProperty FullName
          if (-not $inf2cat) { throw 'inf2cat.exe not found' }
          Write-Host "inf2cat: $inf2cat"
          # Valid ARM64 identifiers per Inf2Cat docs (there is no plain "10_ARM64").
          & $inf2cat /driver:$dir /os:10_VB_ARM64,10_GE_ARM64 /verbose
          if ($LASTEXITCODE -ne 0) { throw "inf2cat failed with $LASTEXITCODE" }
          if (-not (Test-Path "$dir\SiUsbXpArm64.cat")) { throw 'catalog not generated' }

      - name: Sign catalog
        shell: pwsh
        run: |
          $dir = '${{ steps.out.outputs.dir }}'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
                      Where-Object { $_.FullName -match '\\x64\\' } |
                      Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /v /fd SHA256 /s My /sha1 ${{ steps.cert.outputs.thumb }} "$dir\SiUsbXpArm64.cat"
          if ($LASTEXITCODE -ne 0) { throw 'cat signing failed' }

      - name: Verify signatures
        shell: pwsh
        run: |
          $dir = '${{ steps.out.outputs.dir }}'
          # Trust the throw-away test cert on the runner so the chain can be
          # validated; otherwise signtool reports an untrusted root.
          certutil -addstore -f Root "$dir\SiUsbXpArm64Test.cer" | Out-Null
          certutil -addstore -f TrustedPublisher "$dir\SiUsbXpArm64Test.cer" | Out-Null

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
                      Where-Object { $_.FullName -match '\\x64\\' } |
                      Select-Object -First 1 -ExpandProperty FullName

          & $signtool verify /pa /v "$dir\SiUsbXpArm64.sys"
          $sysOk = ($LASTEXITCODE -eq 0)
          & $signtool verify /pa /v "$dir\SiUsbXpArm64.cat"
          $catOk = ($LASTEXITCODE -eq 0)
          Write-Host "sys signature valid: $sysOk"
          Write-Host "cat signature valid: $catOk"

          # Test certs are not timestamped, which /pa counts as an error on some
          # tool versions; only fail when neither file carries a signature.
          if (-not $sysOk -and -not $catOk) {
            throw 'neither the binary nor the catalog signature could be verified'
          }

      - name: Assemble package
        shell: pwsh
        run: |
          $dir = '${{ steps.out.outputs.dir }}'
          $pkg = 'pkg'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "$dir\SiUsbXpArm64.sys" -Destination $pkg -Force
          # Use the stamped INF from the build directory, not the repo source,
          # so DriverVer advances with every release.
          Copy-Item "$dir\SiUsbXpArm64.inf" -Destination $pkg -Force
          if (-not (Test-Path "$dir\SiUsbXpArm64.cat")) { throw 'SiUsbXpArm64.cat was not generated by the build' }
          Copy-Item "$dir\SiUsbXpArm64.cat" $pkg -Force
          Copy-Item "$dir\SiUsbXpArm64Test.cer" $pkg
          Copy-Item README.md, docs\ANALYSIS.md -Destination $pkg
          $install = @(
            'ELAN USB UICE (USBXpress 3.3) driver - ARM64 build',
            '=================================================',
            '',
            'Contents',
            '  SiUsbXpArm64.sys / .inf / .cat   KMDF function driver package',
            '  SiUsbXpArm64Test.cer             self-signed test certificate (PUBLIC KEY ONLY)',
            '',
            'Install (ARM64 Windows 10/11, elevated)',
            '  1. bcdedit /set testsigning on    (reboot)',
            '  2. IMPORTANT: use the .cer from THIS zip. Every build generates a',
            '     new self-signed certificate, so a cert from another release will',
            '     not match these signatures.',
            '     Import SiUsbXpArm64Test.cer into LOCAL MACHINE stores (admin):',
            '       Import-Certificate -FilePath .\SiUsbXpArm64Test.cer -CertStoreLocation Cert:\LocalMachine\Root',
            '       Import-Certificate -FilePath .\SiUsbXpArm64Test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher',
            '     (both stores are required; CurrentUser stores are ignored by driver install)',
            '  3. pnputil /add-driver SiUsbXpArm64.inf /install',
            '',
            'This package is TEST-SIGNED and not suitable for production distribution.'
          )
          Set-Content -Path (Join-Path $pkg 'INSTALL.txt') -Value $install -Encoding UTF8
          Get-ChildItem $pkg | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiUsbXpArm64
          path: pkg/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: driver
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SiUsbXpArm64
          path: dist

      - name: Create archive
        run: |
          cd dist
          zip -r "../SiUsbXpArm64-${GITHUB_REF_NAME}.zip" .

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: SiUsbXpArm64-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            ARM64 build of the USBXpress-compatible ELAN USB UICE driver.

            **Test-signed** — install with `testsigning on` and the included
            `SiUsbXpArm64Test.cer`, or re-sign with your own certificate.
            See `docs/ANALYSIS.md` for the reverse-engineering notes and the
            list of known behavioural differences.
