name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CONFIGURATION: Release
  PLATFORM: ARM64

jobs:
  driver:
    name: Build ARM64 driver
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The hosted image ships Visual Studio 2022 and a Windows 10 SDK but no
      # WDK, so install the matching SDK + WDK (24H2 / 10.0.26100) first.
      # windows-2022 ships the WDK (10.1.26100.4202) and the WDK VS
      # extension, so no installation is required. Just show the layout so a
      # regression in the image is easy to spot.
      - name: Show WDK layout
        shell: pwsh
        run: |
          $roots = @(
            'C:\Program Files (x86)\Windows Kits\10\Include',
            'C:\Program Files (x86)\Windows Kits\10\Lib',
            'C:\Program Files (x86)\Windows Kits\10\bin'
          )
          foreach ($r in $roots) {
            Write-Host "== $r"
            if (Test-Path $r) { Get-ChildItem $r -Directory | ForEach-Object { Write-Host "   $($_.Name)" } }
          }
          $wdf = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10' -Recurse -Filter wdf.h -ErrorAction SilentlyContinue |
                 Select-Object -First 3
          if ($wdf) { $wdf | ForEach-Object { Write-Host "wdf.h: $($_.FullName)" } }
          else { Write-Host '::warning::wdf.h not found under Windows Kits' }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build driver (ARM64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild SiUsbXpArm64.vcxproj `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /v:minimal /m
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "msbuild failed with exit code $code" }

      - name: Locate build output
        id: out
        shell: pwsh
        run: |
          $sys = Get-ChildItem -Recurse -Filter SiUsbXpArm64.sys | Select-Object -First 1
          if (-not $sys) { throw 'SiUsbXpArm64.sys not produced' }
          $dir = $sys.DirectoryName
          Write-Host "Output: $dir"
          "dir=$dir" >> $env:GITHUB_OUTPUT

      # TEST signing only. Production use requires an EV certificate and
      # Microsoft attestation signing; see README.md.
      - name: Test-sign driver package
        shell: pwsh
        run: |
          $dir = '${{ steps.out.outputs.dir }}'
          $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject 'CN=SiUsbXpArm64 Test' `
              -KeySpec Signature -KeyUsage DigitalSignature -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -CertStoreLocation Cert:\CurrentUser\My `
              -NotAfter (Get-Date).AddYears(3)
          Export-Certificate -Cert $cert -FilePath (Join-Path $dir 'SiUsbXpArm64Test.cer') | Out-Null

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
                      Where-Object { $_.FullName -match '\\x64\\' } |
                      Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found' }

          & $signtool sign /v /fd SHA256 /s My /n 'SiUsbXpArm64 Test' "$dir\SiUsbXpArm64.sys"
          if ($LASTEXITCODE -ne 0) { throw 'sys signing failed' }
          if (Test-Path "$dir\SiUsbXpArm64.cat") {
            & $signtool sign /v /fd SHA256 /s My /n 'SiUsbXpArm64 Test' "$dir\SiUsbXpArm64.cat"
            if ($LASTEXITCODE -ne 0) { throw 'cat signing failed' }
          }

      - name: Assemble package
        shell: pwsh
        run: |
          $dir = '${{ steps.out.outputs.dir }}'
          $pkg = 'pkg'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "$dir\SiUsbXpArm64.sys" -Destination $pkg -Force
          Copy-Item 'inf\SiUsbXpArm64.inf' -Destination $pkg -Force
          if (-not (Test-Path "$dir\SiUsbXpArm64.cat")) { throw 'SiUsbXpArm64.cat was not generated by the build' }
          Copy-Item "$dir\SiUsbXpArm64.cat" $pkg -Force
          Copy-Item "$dir\SiUsbXpArm64Test.cer" $pkg
          Copy-Item README.md, docs\ANALYSIS.md -Destination $pkg
          $install = @(
            'ELAN USB UICE (USBXpress 3.3) driver - ARM64 build',
            '=================================================',
            '',
            'Contents',
            '  SiUsbXpArm64.sys / .inf / .cat   KMDF function driver package',
            '  SiUsbXpArm64Test.cer             self-signed test certificate (PUBLIC KEY ONLY)',
            '',
            'Install (ARM64 Windows 10/11, elevated)',
            '  1. bcdedit /set testsigning on    (reboot)',
            '  2. Import SiUsbXpArm64Test.cer into "Trusted Root Certification Authorities"',
            '     and "Trusted Publishers"',
            '  3. pnputil /add-driver SiUsbXpArm64.inf /install',
            '',
            'This package is TEST-SIGNED and not suitable for production distribution.'
          )
          Set-Content -Path (Join-Path $pkg 'INSTALL.txt') -Value $install -Encoding UTF8
          Get-ChildItem $pkg | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiUsbXpArm64
          path: pkg/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: driver
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SiUsbXpArm64
          path: dist

      - name: Create archive
        run: |
          cd dist
          zip -r "../SiUsbXpArm64-${GITHUB_REF_NAME}.zip" .

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: SiUsbXpArm64-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            ARM64 build of the USBXpress-compatible ELAN USB UICE driver.

            **Test-signed** — install with `testsigning on` and the included
            `SiUsbXpArm64Test.cer`, or re-sign with your own certificate.
            See `docs/ANALYSIS.md` for the reverse-engineering notes and the
            list of known behavioural differences.
